<!doctype html>
<html lang="pt-BR">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<title>Contato | Amigo Fiel</title>
		<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
		<link rel="preconnect" href="https://fonts.googleapis.com">
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
		<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
		<style>
			:root {
				--ink: #24313b;
				--cream: #fff8ed;
				--coral: #ee765d;
				--coral-dark: #c95143;
				--mint: #dff3e9;
				--gold: #f4bd55;
			}

			body {
				background: var(--cream);
				color: var(--ink);
				font-family: "Nunito", sans-serif;
			}

			.navbar {
				background: #ffffff;
				border-bottom: 1px solid #f2e4d3;
			}

			.brand-mark {
				align-items: center;
				background: var(--coral);
				border-radius: 12px;
				color: #ffffff;
				display: inline-flex;
				font-size: 1.2rem;
				height: 40px;
				justify-content: center;
				margin-right: 0.6rem;
				width: 40px;
			}

			.contact-card,
			.form-card {
				background: #ffffff;
				border: 1px solid #f1e7d8;
				border-radius: 18px;
			}

			.section-title {
				font-weight: 900;
			}

			.icon-box {
				align-items: center;
				background: #fff1dc;
				border-radius: 12px;
				display: flex;
				font-size: 1.5rem;
				height: 52px;
				justify-content: center;
				width: 52px;
			}

			.btn-coral {
				background: var(--coral);
				border-color: var(--coral);
				color: #ffffff;
				font-weight: 800;
			}

			.btn-coral:hover {
				background: var(--coral-dark);
				border-color: var(--coral-dark);
				color: #ffffff;
			}

			.footer {
				color: #66737a;
				font-size: 0.9rem;
			}
		</style>
	</head>
	<body>
		<nav class="navbar navbar-expand-lg" aria-label="Navegação principal">
			<div class="container py-2">
				<a class="navbar-brand d-flex align-items-center fw-bold" href="index.html">
					<span class="brand-mark" aria-hidden="true">🐾</span>
					Amigo Fiel
				</a>
				<div class="d-flex flex-wrap gap-3 ms-auto">
					<a class="nav-link text-secondary" href="index.html">Início</a>
					<a class="nav-link text-secondary" href="produtos.html">Produtos</a>
					<a class="nav-link text-secondary" href="agendamentos.html">Agendamentos</a>
					<a class="nav-link text-secondary" href="contato.html">Contato</a>
				</div>
			</div>
		</nav>

		<main class="container py-5">
			<div class="row mb-4">
				<div class="col-12 text-center">
					<p class="text-uppercase fw-bold text-danger mb-2">Fale conosco</p>
					<h1 class="display-5 fw-bold section-title mb-3">Estamos aqui para ajudar seu pet</h1>
				</div>
			</div>

			<div class="row g-4 mb-4">
				<div class="col-12 col-md-4">
					<div class="contact-card p-4 shadow-sm h-100">
						<div class="icon-box mb-3" aria-hidden="true">📍</div>
						<h2 class="h5 section-title">Localização</h2>
						<p class="text-secondary mb-0">Rua das Flores, 128 · Centro · São Paulo - SP</p>
					</div>
				</div>
				<div class="col-12 col-md-4">
					<div class="contact-card p-4 shadow-sm h-100">
						<div class="icon-box mb-3" aria-hidden="true">📞</div>
						<h2 class="h5 section-title">Telefone</h2>
						<p class="text-secondary mb-0">(11) 3456-7890</p>
					</div>
				</div>
				<div class="col-12 col-md-4">
					<div class="contact-card p-4 shadow-sm h-100">
						<div class="icon-box mb-3" aria-hidden="true">✉️</div>
						<h2 class="h5 section-title">E-mail</h2>
						<p class="text-secondary mb-0">contato@amigofielpet.com</p>
					</div>
				</div>
			</div>

			<div class="row">
				<div class="col-lg-8">
					<form class="form-card p-4 p-md-5 shadow-sm">
						<div class="mb-3">
							<label for="nome" class="form-label fw-bold">Seu nome</label>
							<input type="text" class="form-control" id="nome" placeholder="Digite seu nome">
						</div>
						<div class="mb-3">
							<label for="email" class="form-label fw-bold">E-mail</label>
							<input type="email" class="form-control" id="email" placeholder="voce@email.com">
						</div>
						<div class="mb-3">
							<label for="assunto" class="form-label fw-bold">Assunto</label>
							<input type="text" class="form-control" id="assunto" placeholder="Sobre qual assunto você quer falar?">
						</div>
						<div class="mb-3">
							<label for="mensagem" class="form-label fw-bold">Mensagem</label>
							<textarea class="form-control" id="mensagem" rows="5" placeholder="Escreva sua mensagem..."></textarea>
						</div>
						<button type="submit" class="btn btn-coral px-4 py-2">Enviar mensagem</button>
					</form>
				</div>
			</div>
		</main>

		<footer class="footer container pb-4 text-center">Amigo Fiel Pet Shop · Feito com carinho para quem ama pets</footer>
		<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
	</body>
</html>
